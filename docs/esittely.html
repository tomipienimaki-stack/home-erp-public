<title>Koti-sovellus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: keynote. A 3D kitchen loop fills the screen; each slide is centre (title), side (text left, one module right) or top (text above, the whole loop below). Single dark look, the app's own palette. */
:root{
  color-scheme:dark;
  --bg:#111915; --surface:#1A241F; --text:#F3EEE4; --muted:#A8AB9F; --line:#2C3832;
  --sage:#8FB39C; --terra:#D9825F; --sun:#E3B860;
  --card:#F6F1E7; --card-ink:#1E2A23; --card-muted:#6A7068; --card-line:#E3DCCD; --forest:#2D4A3E; --forest-50:#E5EDE7; --terra-50:#F5E3D9; --sun-50:#F6EBCF;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
}
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased}
#gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
#vig{position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 90% 80% at 50% 58%, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 100%)}
#labels{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.lbl{position:absolute; left:0; top:0; white-space:nowrap; text-align:center; opacity:0; transition:opacity .5s; will-change:transform; text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.9)}
.lbl.on{opacity:1}
.lbl b{display:block; font-family:var(--display); font-weight:400; font-size:clamp(13px, 1.15vw, 17px); color:var(--text)}
.lbl small{display:block; font-family:var(--mono); font-size:clamp(9px, .72vw, 10.5px); letter-spacing:.12em; text-transform:uppercase; margin-top:2px; color:var(--sage)}
.lbl.act b{color:var(--sun)}
.lbl.core b{font-size:clamp(11px, .95vw, 14px); color:var(--muted); font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase}
.lbl.claude b{color:var(--terra); font-family:var(--mono); font-size:clamp(11px, .95vw, 13px); letter-spacing:.14em; text-transform:uppercase}

#stage{position:fixed; inset:0; pointer-events:none; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
#top{position:absolute; left:0; right:0; top:calc(22px + env(safe-area-inset-top, 0px)); display:flex; justify-content:center; align-items:center; gap:9px}
#mk{display:block; width:20px; height:20px; flex:none}
#brand{font-family:var(--display); font-weight:400; font-size:17px; color:var(--text)}
#copy{position:absolute; text-align:center}
#stage.center #copy{left:8vw; right:8vw; top:50%; transform:translateY(-50%)}
#stage.top #copy{left:8vw; right:8vw; top:12vh}
#stage.side #copy{left:max(6vw, env(safe-area-inset-left, 0px)); top:50%; transform:translateY(-54%); width:min(38vw, 580px); text-align:left}
.eyebrow{font-family:var(--mono); font-size:clamp(11px, .95vw, 13px); letter-spacing:.24em; text-transform:uppercase; color:var(--muted); margin-bottom:18px}
h1{font-family:var(--display); font-weight:300; line-height:1.08; letter-spacing:-.015em; margin:0; text-wrap:balance}
#stage.center h1{font-size:clamp(34px, 5.4vw, 82px)}
#stage.top h1{font-size:clamp(28px, 4.2vw, 62px); max-width:20em; margin-inline:auto}
#stage.side h1{font-size:clamp(28px, 3.5vw, 54px)}
h1 em{font-style:italic; color:var(--accent, var(--text))}
.sub{font-weight:300; line-height:1.45; color:var(--muted); margin:18px auto 0; max-width:34em; text-wrap:balance}
#stage.top .sub{font-size:clamp(15px, 1.4vw, 21px)}
#stage.center .sub{font-size:clamp(16px, 1.6vw, 24px); margin-top:26px}
#stage.side .sub{font-size:clamp(15px, 1.25vw, 20px); margin-left:0; max-width:none}
.sub b{font-weight:500; color:var(--text)}
.three{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:clamp(14px, 3vw, 44px); margin:36px auto 0; max-width:1040px; text-align:left}
.three div{border-top:1px solid var(--line); padding-top:14px; min-width:0; position:relative}
.three div::before{content:""; position:absolute; top:-1px; left:0; width:16px; height:2px; background:var(--sun)}
.three b{display:block; font-family:var(--display); font-weight:400; font-size:clamp(18px, 1.8vw, 26px)}
.three span{display:block; font-weight:300; font-size:clamp(13.5px, 1.15vw, 17px); color:var(--muted); margin-top:8px; line-height:1.45}
.anim{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
.anim.d1{animation-delay:.12s} .anim.d2{animation-delay:.24s}
@keyframes rise{from{opacity:0; transform:translateY(22px); filter:blur(6px)} to{opacity:1; transform:none; filter:blur(0)}}

#bottom{position:absolute; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; align-items:center; gap:18px; pointer-events:auto}
#dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60vw}
#dots i{display:block; width:6px; height:2px; background:var(--line); transition:background .3s, transform .3s}
#dots i.cur{background:var(--sun); transform:scaleX(1.8)} #dots i.done{background:var(--muted)}
#dots s{display:block; width:10px}
.nav{font:inherit; cursor:pointer; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:15px; line-height:1}
.nav:hover{border-color:var(--sun)} .nav:focus-visible{outline:2px solid var(--sun); outline-offset:2px}
#hint{position:fixed; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(28px + env(safe-area-inset-bottom, 0px)); font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:rgba(168,171,159,.55)}

/* what a person sees: app screens, in the app's own light look */
#cards{position:absolute; display:flex; gap:22px; pointer-events:none}
#stage.side #cards{right:6vw; top:50%; transform:translateY(-50%)}
#stage.top #cards{left:50%; top:46vh; transform:translateX(-50%)}
.card{background:var(--card); color:var(--card-ink); border-radius:18px; padding:18px 20px; box-shadow:0 30px 80px rgba(0,0,0,.55); font-size:14px; width:min(400px, 36vw); box-sizing:border-box; text-align:left}
.k-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px}
.k-title{font-family:var(--display); font-size:20px; font-weight:400; color:var(--forest)}
.k-meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--card-muted); white-space:nowrap}
.k-grp{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--card-muted); margin:12px 0 6px}
.k-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--card-line)}
.k-row:first-of-type{border-top:0}
.k-day{font-family:var(--mono); font-size:11px; width:22px; color:var(--card-muted); text-transform:uppercase}
.k-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.k-qty{font-variant-numeric:tabular-nums; color:var(--card-muted); white-space:nowrap}
.chip{display:inline-block; font-size:11px; line-height:1; padding:5px 8px; border-radius:999px; white-space:nowrap; background:var(--forest-50); color:var(--forest)}
.chip.t{background:var(--terra-50); color:#8A4528} .chip.s{background:var(--sun-50); color:#77591A}
.box{width:16px; height:16px; border-radius:5px; border:1.5px solid #B9B3A4; flex:none; display:grid; place-items:center; transition:background .3s, border-color .3s}
.box.on{background:var(--forest); border-color:var(--forest)}
.box.on::after{content:""; width:7px; height:4px; border:2px solid var(--card); border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px)}
.k-row.done .k-name{color:var(--card-muted); text-decoration:line-through}
.k-note{margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--forest-50); color:var(--forest); font-size:12.5px; line-height:1.45}
.k-photo{height:74px; border-radius:12px; margin-bottom:12px; background:repeating-linear-gradient(-8deg, #E9E1D1 0 9px, #E2D9C6 9px 18px); position:relative; overflow:hidden}
.k-photo::after{content:"kuva lehdestä"; position:absolute; left:10px; bottom:8px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#8D8572}
.scan{position:absolute; left:0; right:0; height:2px; background:var(--terra); box-shadow:0 0 12px var(--terra); animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%{top:6%} 50%{top:90%} 100%{top:6%}}
.bubble{padding:10px 13px; border-radius:14px; line-height:1.45; font-size:13.5px; max-width:88%}
.bubble.me{margin-left:auto; background:var(--forest); color:var(--card); border-bottom-right-radius:4px}
.bubble.ai{background:#EFE8DA; color:var(--card-ink); border-bottom-left-radius:4px; margin-top:10px}
.who{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--terra); margin:12px 0 4px}
.chat{display:flex; flex-direction:column}
.typing .bubble.ai{opacity:0; transform:translateY(6px); transition:opacity .5s, transform .5s}
.typing.shown .bubble.ai{opacity:1; transform:none}

/* real screenshots: a browser frame, a phone frame and a fanned gallery */
.frame{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); width:min(640px, 46vw)}
.frame .bar{display:flex; align-items:center; gap:6px; padding:9px 12px; background:#E9E3D6}
.frame .bar i{width:9px; height:9px; border-radius:50%; background:#CFC6B4; flex:none}
.frame .bar span{margin-left:8px; flex:1; min-width:0; font-family:var(--mono); font-size:10.5px; color:#857D6C; background:var(--card); border-radius:999px; padding:4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frame img, .phone img{display:block; width:100%; height:auto}
.phones{display:flex; gap:22px; align-items:flex-end}
.phone{width:min(230px, 17vw); border-radius:30px; padding:7px; background:#0B100D; box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px #2A332E}
.phone img{border-radius:24px}
.phone.b{transform:translateY(-28px)}
.gallery{position:relative; width:min(1100px, 92vw); height:min(330px, 24vw); perspective:1600px}
.gallery .frame{position:absolute; left:50%; top:0; width:min(470px, 34vw); margin-left:calc(min(470px, 34vw) / -2); transform-origin:50% 50%;
  transform:translateX(calc(var(--i) * 62%)) translateZ(calc(var(--d) * -150px)) rotateY(calc(var(--i) * -16deg)); z-index:calc(10 - var(--d));
  animation:fan 1.2s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--d) * .1s + .2s)}
.gallery .frame .bar span{font-size:9.5px}
@keyframes fan{from{opacity:0; transform:translateY(40px) rotateX(18deg)}}
@media (max-width:760px){
  .frame{width:86vw} .phone{width:38vw; border-radius:24px; padding:5px} .phone img{border-radius:20px} .phones{gap:14px}
  .gallery{width:86vw; height:auto} .gallery .frame{position:relative; left:auto; margin-left:0; width:86vw; transform:none; animation:none} .gallery .frame:not(.c){display:none}
}
@media (prefers-reduced-motion: reduce){ .gallery .frame{animation:none} }
@media (max-width:760px){
  #stage.side #copy{left:8vw; right:8vw; top:11vh; width:auto; transform:none; text-align:center}
  #stage.side #cards, #stage.top #cards{left:50%; right:auto; top:auto; bottom:calc(76px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%)}
  .card{width:86vw; font-size:13px; padding:14px 16px} .k-title{font-size:17px}
  .three{grid-template-columns:1fr; gap:12px; margin-top:20px}
  #stage.side h1, #stage.top h1{font-size:26px} #stage.side .sub, #stage.top .sub{font-size:14.5px; margin-inline:auto; max-width:30em}
  #stage.center h1{font-size:32px}
  #hint{display:none} .lbl small{display:none}
  #dots{gap:3px; max-width:none} #dots i{width:4px} #dots s{width:5px} #bottom{gap:12px}
  body.has-card .lbl{display:none}
}
@media (max-height:700px) and (max-width:760px){ .k-photo{display:none} .k-row{padding:4px 0} }
@media (prefers-reduced-motion: reduce){ .anim{animation:none} .lbl{transition:none} .scan{animation:none; top:50%} }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="vig"></div>
<div id="labels" aria-hidden="true"></div>
<div id="stage" class="center">
  <div id="top">
    <svg id="mk" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="24" height="24" rx="7" fill="#2D4A3E"/><path d="M7 11.2 12 7l5 4.2V17a.8.8 0 0 1-.8.8h-2.6v-3.6h-3.2v3.6H7.8A.8.8 0 0 1 7 17z" fill="none" stroke="#F3EEE4" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span id="brand">Koti</span>
  </div>
  <div id="copy" aria-live="polite"></div>
  <div id="cards" aria-live="polite"></div>
  <div id="bottom">
    <button class="nav" id="prev" aria-label="Edellinen">&#8592;</button>
    <div id="dots" aria-hidden="true"></div>
    <button class="nav" id="next" aria-label="Seuraava">&#8594;</button>
  </div>
</div>
<div id="hint">→ seuraava · ← takaisin</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ---------- the cast ---------- */
const NODES = [
  {k:'rec', name:'Reseptit', sub:'kuvasta valmiiksi mitoitetuksi'},
  {k:'week', name:'Viikko', sub:'lauantaista perjantaihin'},
  {k:'shop', name:'Ostokset', sub:'kaupan kiertojärjestyksessä'},
  {k:'pantry', name:'Varasto', sub:'saldot ja hälytysrajat'},
  {k:'freezer', name:'Pakastin', sub:'rasiat päivämäärineen'}
];
const IX = Object.fromEntries(NODES.map((n, i) => [n.k, i]));
const SUN = 'var(--sun)', TERRA = 'var(--terra)';

/* ---------- the story ---------- */
/* scene: chaos | loop. focus: all | node key. act: [keys]. labels: none | all | act | core. flow, cycle, claude: booleans. card: week | recipe | shop | shopcheck | cadence | freezer | chatfreezer | chatshop */
const S = [
  {h:'Keittiö, joka <em>muistaa.</em>', sub:'Koti pitää kirjaa resepteistä, viikon ruoista, kauppalistasta, varastosta ja pakastimesta. Claude hoitaa kirjaamisen puolestasi.', scene:'loop', focus:'all', flow:true, labels:'none', dim:true, accent:SUN},

  /* 01 · Arki */
  {h:'Mitä syödään tänään?', sub:'Joka ilta sama kysymys. Vastaus riippuu siitä, mitä kaapissa on, mitä syötiin eilen ja mitä jäi yli.', scene:'chaos', labels:'all', quiet:true},
  {h:'Tieto on viidessä paikassa, <em>eikä mikään puhu toisilleen.</em>', sub:'Reseptit kirjanmerkeissä, kauppalista muistilapulla, pakastimen sisältö muistin varassa. Osa ruoasta vanhenee, osa ostetaan kahteen kertaan.', scene:'chaos', labels:'all', busy:true, accent:TERRA},

  /* 02 · Yksi järjestelmä */
  {h:'Yksi järjestelmä koko keittiölle.', sub:'Viikko, reseptit, ostokset, varasto ja pakastin jakavat saman tiedon. Kun yksi muuttuu, muut tietävät sen.', scene:'loop', focus:'all', flow:true, labels:'all', core:true},
  {h:'Kierto pyörii <em>itsestään.</em>', sub:'Resepti viikolle, ainekset listalle, ostokset varastoon. Kun varasto tyhjenee, tuote palaa listalle.', scene:'loop', focus:'all', flow:true, cycle:true, labels:'all', accent:SUN},
  {h:'Tältä se näyttää.', sub:'Viisi näkymää, yksi sovellus. Kuvat ovat oikeasta sovelluksesta oikeilla resepteillä, viikko on esimerkki.', scene:'loop', focus:'all', labels:'none', quiet:true, layout:'top', card:'gallery'},

  /* 03 · Viikko */
  {h:'Viikko suunnittelee itsensä.', sub:'AI ehdottaa viikon ruoat. Se huomioi pakastimen sisällön, edellisten päivien tähteet ja sen, ettei samaa ruokaa tule kahta viikkoa peräkkäin.', scene:'loop', focus:'week', act:['week','freezer'], labels:'act', card:'shot:viikko'},
  {h:'Yksi iso kattila, <em>kolme päivällistä.</em>', sub:'Kun keität ison satsin keittoa, viikko tietää sen. Tähteet syödään ennen kuin mitään uutta keitetään, ja ostoslistan määrät lasketaan koko satsille.', scene:'loop', focus:'week', act:['week','shop'], labels:'act', card:'week', accent:SUN},

  /* 04 · Reseptit */
  {h:'Kuva riittää.', sub:'Valokuva lehdestä tai keittokirjasta. AI lukee ainekset ja vaiheet ja tallentaa reseptin valmiiksi mitoitettuna.', scene:'loop', focus:'rec', act:['rec'], labels:'act', card:'recipe'},
  {h:'Annosmäärä <em>ohjaa kaikkea.</em>', sub:'Tuplaa resepti, niin ostoslistan määrät tuplaantuvat. Suola, jauhot ja muut perustarvikkeet oletetaan kaapissa oleviksi, joten ne eivät täytä listaa.', scene:'loop', focus:'rec', act:['rec','shop'], labels:'act', card:'shot:reseptit', accent:SUN},

  /* 05 · Ostokset */
  {h:'Kauppalista kirjoittaa itsensä.', sub:'Viikon reseptien ainekset, vakiotuotteet ja loppuvat varastotuotteet samalla listalla. Ryhmiteltynä siihen järjestykseen, jossa kauppa kierretään.', scene:'loop', focus:'shop', act:['shop','week','pantry'], labels:'act', card:'shot:ostokset'},
  {h:'Vakiotuotteilla on <em>oma rytminsä.</em>', sub:'Ruisleipä joka reissulla, kananmunat kahden viikon välein, talouspaperi kerran kuussa. Rastittu tuote poistuu listalta ja palaa, kun rytmi täyttyy.', scene:'loop', focus:'shop', act:['shop'], labels:'act', card:'cadence', accent:SUN},

  /* 06 · Varasto ja pakastin */
  {h:'Rastitus päivittää varaston.', sub:'Ostettu tuote siirtyy varastoon. Päivittäinen kulutus vähentää saldoa, ja kun hälytysraja alittuu, tuote hyppää takaisin listalle.', scene:'loop', focus:'pantry', act:['pantry','shop'], labels:'act', card:'shopcheck'},
  {h:'Varasto yhdellä silmäyksellä.', sub:'Mitä kotoa löytyy, mikä on vähissä ja mikä loppu. Tila vaihtuu yhdellä napautuksella, ja loppunut tuote siirtyy listalle.', scene:'loop', focus:'pantry', act:['pantry'], labels:'act', card:'shot:varasto'},
  {h:'Pakastin <em>ei unohdu.</em>', sub:'Jokainen erä on kirjattu päivämäärän kanssa, vanhin ylimpänä. Viikkosuunnitelma käyttää pakastetut ruoat ennen kuin ne ehtivät vanhentua.', scene:'loop', focus:'freezer', act:['freezer','week'], labels:'act', card:'shot:pakastin', accent:SUN},

  /* 07 · Claude */
  {h:'Et kirjoita mitään. <em>Sanot sen.</em>', sub:'Claude käyttää Kotia suoraan. Tallenna resepti kuvasta, kysy mitä pakastimessa on tai kerro, että kävit kaupassa.', scene:'loop', focus:'all', claude:true, flow:true, labels:'all', accent:TERRA},
  {h:'Mitä pakastimessa on?', sub:'Claude vastaa oikeista tiedoista eikä arvaa. Se myös ehdottaa, mitä kannattaa syödä ensin.', scene:'loop', focus:'freezer', claude:true, act:['freezer'], labels:'act', card:'chatfreezer'},
  {h:'Kävin kaupassa.', sub:'Yksi lause riittää. Claude kuittaa ostokset, siirtää ne varastoon ja käynnistää vakiotuotteiden rytmit alusta.', scene:'loop', focus:'shop', claude:true, act:['shop','pantry'], labels:'act', card:'chatshop'},

  /* 08 · Kaikkialla */
  {h:'Aina mukana.', three:[['Puhelimessa','Asennetaan aloitusnäyttöön kuin mikä tahansa sovellus. Kauppalista aukeaa kaupassa yhdellä napautuksella.'], ['Tabletilla','Reseptinäkymä keittiön tasolla, annokset ja vaiheet isolla.'], ['Clauden kautta','Puheella tai tekstillä, missä tahansa Claude on käytössä.']], scene:'loop', focus:'all', flow:true, labels:'none', quiet:true},
  {h:'Puhelimessa <em>kuin sovellus.</em>', sub:'Viikko ja kauppalista kulkevat taskussa. Valikko on peukalon ulottuvilla, ja kauppanäkymä näyttää tuotteet siinä järjestyksessä, jossa ne kaupasta löytyvät.', scene:'loop', focus:'all', labels:'none', quiet:true, layout:'side', card:'phones', accent:SUN},

  /* 09 · Miten se on tehty */
  {h:'Rakennettu <em>omalla ohjelmistotehtaalla.</em>', three:[['Speksistä tuotantoon','AI-agentit toteuttavat, toinen agentti katselmoi ja ihminen hyväksyy jokaisen julkaisun.'], ['Ilmaisilla pilvipalveluilla','Palvelin ja tietokanta pyörivät ilmaistasolla. Vain AI-toiminnot maksavat käytön mukaan.'], ['Oma data, suojattuna','Kirjautuminen vaaditaan, eikä tietoja jaeta kenellekään.']], scene:'loop', focus:'all', flow:true, labels:'none', quiet:true, accent:SUN},
